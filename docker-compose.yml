services:
  postgres:
    image: postgres:16-alpine
    container_name: novacart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novacart
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d novacart']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacart-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: NovaCart
      APP_URL: http://localhost:3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/novacart?schema=public
      JWT_SECRET: novacart-docker-jwt-secret-change-me-32chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: novacart-docker-refresh-secret-change-me-32
      JWT_REFRESH_EXPIRES_IN: 7d
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      UPLOAD_DEST: ./uploads
      MAX_FILE_SIZE: 5242880
      ALLOWED_IMAGE_TYPES: image/jpeg,image/png,image/webp,image/gif
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173
      LOG_LEVEL: info
      SEED_ADMIN_EMAIL: admin@novacart.com
      SEED_ADMIN_PASSWORD: Admin@123456
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  logs_data:
