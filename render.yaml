services:
  - type: web
    name: novacart-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_NAME
        value: NovaCart
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: novacart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 100
      - key: UPLOAD_DEST
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: ALLOWED_IMAGE_TYPES
        value: image/jpeg,image/png,image/webp,image/gif
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: APP_URL
        sync: false

databases:
  - name: novacart-db
    plan: basic-256mb
    databaseName: novacart
    user: novacart
